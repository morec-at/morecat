name: e2e

# API・RMU・viewer を横断する契約を検証する。PR は required check 化しても
# expected check が欠けないよう全件実行し、main push は関連 path に限定する。
# Action はサプライチェーン保護のためコミット SHA で固定する。

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/rmu/**'
      - 'apps/ui/**'
      - 'apps/e2e/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/e2e.yml'
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-e2e:
    name: local end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@fd3eb131b9b46cc1dd978a7c0ba3fce79dd7d3eb # v3.9.1

      - name: Cache build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.cache/firebase/emulators
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/pnpm/store
            apps/rmu/target
          key: ${{ runner.os }}-e2e-${{ hashFiles('apps/api/build.sbt', 'apps/api/project/build.properties', 'apps/api/project/plugins.sbt', 'apps/rmu/Cargo.lock', 'apps/ui/pnpm-lock.yaml', 'apps/api/firebase.json', 'flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-

      - name: Install UI dependencies
        run: nix develop .#node --command sh -c 'cd apps/ui && pnpm install --frozen-lockfile'

      - name: Run local end-to-end
        id: e2e
        env:
          MORECAT_E2E_ARTIFACT_DIR: .artifacts/local-e2e
        run: nix develop --command ./apps/e2e/local-e2e.sh

      - name: Upload failure logs
        if: ${{ always() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-e2e-failure-logs
          path: .artifacts/local-e2e/**
          if-no-files-found: error
          retention-days: 14
